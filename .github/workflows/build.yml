name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # за създаване на Release при таг v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK е предварително инсталиран на ubuntu-latest (ANDROID_HOME).
      - name: Tests and APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Rename APK
        run: |
          NAME="SubtitleSynchronizer-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleSynchronizer-apk
          path: ${{ env.APK_NAME }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Subtitle Synchronizer ${{ github.ref_name }}
          files: ${{ env.APK_NAME }}
          body: |
            Изтеглете файла **${{ env.APK_NAME }}** отдолу (Assets) и го инсталирайте на приставката.
            Новата версия се инсталира върху старата, без да губите настройките.
