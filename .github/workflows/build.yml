name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # за създаване на Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK е предварително инсталиран на ubuntu-latest (ANDROID_HOME).
      - name: Tests and APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Version and APK name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="SubtitleSynchronizer-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleSynchronizer-apk
          path: ${{ env.APK_NAME }}
      # При всяко качване в main: Release „vВЕРСИЯ“ се създава (или APK в него се подменя).
      - name: Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Subtitle Synchronizer ${{ env.VERSION }}
          make_latest: true
          files: ${{ env.APK_NAME }}
          body: |
            Изтеглете файла **${{ env.APK_NAME }}** отдолу (Assets) и го инсталирайте на приставката.
            Новата версия се инсталира върху старата, без да губите настройките.
